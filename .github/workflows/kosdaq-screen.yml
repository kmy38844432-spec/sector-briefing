name: kosdaq-screen
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: 스크린 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python kosdaq_screen.py
      - name: 결과 커밋
        run: |
          mkdir -p screen
          cp out/kosdaq.html screen/kosdaq.html
          cp out/kosdaq_all.csv screen/kosdaq_all.csv
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add screen/
          git commit -m "kosdaq screen $(date +%F)" || echo "변경 없음"
          git push
